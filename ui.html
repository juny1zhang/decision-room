      <div class="brand"><span class="brand-mark"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 5.5h10v9H8l-4 3v-12Z" stroke="currentColor" stroke-width="1.4"/><path d="M10 9h10v11l-4-3h-6" stroke="currentColor" stroke-width="1.4"/></svg></span><div><div class="brand-name">议事间</div><div class="brand-sub">DECISION ROOM</div></div></div>
      <button class="new-button" id="newRoom"><svg width="15" height="15" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>新的讨论</button>
      <div class="history" id="history"><div class="sidebar-label">讨论记录</div><div id="roomList"><p class="history-empty">正在读取…</p></div></div>

    <main class="main">
      <header class="topbar">
        <button class="icon-button menu-button" id="menuButton" aria-label="打开讨论记录"><svg width="16" height="16" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M4 5h12M4 10h12M4 15h12" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button>
        <div class="heading-wrap"><h1 class="room-heading" id="roomHeading">新的讨论</h1></div>
        <div class="top-actions">
          <button class="connection-pill checking" id="codexPill" aria-label="查看 Codex 连接状态"><span class="connection-dot"></span>Codex</button>
          <button class="connection-pill checking" id="claudePill" aria-label="查看 Claude 连接状态"><span class="connection-dot"></span>Claude</button>
          <button class="connection-pill checking" id="cursorPill" aria-label="查看 Cursor 连接状态"><span class="connection-dot"></span>Cursor</button>
          <button class="icon-button export-button" id="exportButton" aria-label="导出当前讨论" title="导出 Markdown" disabled><svg width="15" height="15" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 2.5v10m-3-3 3 3 3-3M4 12v4h12v-4" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        </div>
      </header>
      <div class="error-banner" id="errorBanner" role="alert" hidden><div class="error-banner-content" id="errorText"></div><button id="dismissError" aria-label="关闭提示">×</button></div>
      <div class="conversation" id="conversation" tabindex="0" aria-label="讨论内容">
        <div class="conversation-inner">
          <section class="empty-state" id="emptyState">
            <div class="participants" id="activeParticipants" aria-label="本轮参与者"></div>
            <h2 class="empty-title">今天想讨论什么？</h2>
            <p class="empty-description"><span id="flowDescription">选择参与者和模型，让他们独立回答或一起审查方案。</span></p>
            <div class="empty-rule"></div>
            <div class="suggestions">
              <button class="suggestion" data-example="我在两个选择之间犹豫。请先帮我梳理判断标准，再分别分析取舍。\n\n选项 A：\n选项 B：\n我最在意的三件事："><span class="suggestion-title">理清一个选择</span><span class="suggestion-text">比较得失、前提和放弃的成本</span><span class="suggestion-arrow">↗</span></button>
              <button class="suggestion" data-example="请帮我比较两个旅行方案，考虑交通、体力、预算和天气，给出推荐与备选。\n\n方案 A：\n方案 B：\n日期与预算："><span class="suggestion-title">商量一次旅行</span><span class="suggestion-text">在想去的地方和轻松之间平衡</span><span class="suggestion-arrow">↗</span></button>
              <button class="suggestion" data-example="请审查这个技术方案，分析容易遗漏的边界和后续维护成本。\n\n当前情况：\n候选方案：\n时间与团队约束："><span class="suggestion-title">审查一个方案</span><span class="suggestion-text">找出遗漏、风险和更好的路径</span><span class="suggestion-arrow">↗</span></button>
            </div>
          </section>
          <div id="messages" aria-live="polite" aria-relevant="additions"></div>
        </div>
      </div>
      <button class="jump-bottom" id="jumpBottom" aria-label="跳到最新消息" hidden><svg width="15" height="15" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 4v12m-5-5 5 5 5-5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <section class="composer-area" aria-label="发送问题">
        <div class="composer-inner">
          <div class="progress" id="progress" role="status" hidden><span class="progress-spinner"></span><span class="progress-text" id="progressText">正在准备讨论…</span><span id="progressElapsed" aria-hidden="true" style="margin-left:auto;white-space:nowrap;font-variant-numeric:tabular-nums"></span></div>
          <form class="composer" id="composer">
            <div class="mode-row">
              <div class="modes" role="group" aria-label="讨论方式">
                <button type="button" class="mode-button active" data-mode="debate" aria-pressed="true">联合讨论</button>
                <button type="button" class="mode-button" data-mode="both" aria-pressed="false">分别回答</button>
                <button type="button" class="mode-button" data-mode="single" aria-pressed="false">单独提问</button>
              </div>
              <button type="button" class="context-button" id="contextButton"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M4 2h6l3 3v9H4V2Zm6 0v3h3M6 8h5M6 11h5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>共同背景<span class="context-dot" id="contextDot" hidden></span></button>
            </div>
            <label class="sr-only" for="prompt">你想讨论的问题</label><textarea class="prompt" id="prompt" maxlength="20000" rows="2" placeholder="说说你想决定什么，以及你最在意的事…"></textarea>
            <div class="composer-bottom"><div class="composer-options"><button type="button" class="config-button" id="configureButton" aria-haspopup="dialog">
              <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M2 4h4m3 0h5M2 12h7m3 0h2M2 8h1m3 0h8" stroke="currentColor" stroke-linecap="round"/><circle cx="7.5" cy="4" r="1.5" stroke="currentColor"/><circle cx="4.5" cy="8" r="1.5" stroke="currentColor"/><circle cx="10.5" cy="12" r="1.5" stroke="currentColor"/></svg>模型与能力</button><label class="web-toggle" id="webControl"><input type="checkbox" id="webSearch">允许查找网页</label><span class="key-hint" id="keyHint">⌘ Enter 发送</span></div><button type="submit" class="send-button" id="sendButton" disabled><span id="sendLabel">开始讨论</span><svg width="14" height="14" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M4 16 16 4M5 4h11v11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button><button type="button" class="stop-button" id="stopButton" hidden><svg width="10" height="10" viewBox="0 0 10 10" fill="currentColor" aria-hidden="true"><rect x="1" y="1" width="8" height="8" rx="1"/></svg><span id="stopLabel">停止讨论</span></button></div>
          </form>
          <div class="composer-footer"><span class="mode-help" id="modeHelp">独立回答 · 交叉审查 · 汇总结论</span><span class="privacy-note">模型在云端处理 · 记录保存在本机</span></div>
        </div>
      </section>
    </main>
  </div>
  <dialog id="contextDialog" aria-labelledby="contextTitle"><div class="dialog-head"><div><h2 class="dialog-title" id="contextTitle">共同背景</h2><div class="dialog-sub">填写所有参与者需要了解的事实、目标与约束。<br>这里的内容会随你的下一次提问一起发送。</div></div><button class="icon-button" id="closeContext" aria-label="关闭共同背景">×</button></div><div class="dialog-body"><label class="sr-only" for="contextInput">填写共同背景</label><textarea id="contextInput" class="context-textarea" maxlength="40000" placeholder="我的目标：&#10;&#10;已经确认的事实：&#10;&#10;预算、时间与其他限制：&#10;&#10;还不确定的事情："></textarea><div class="dialog-foot"><span id="contextCount">0 / 40,000 字符</span><button class="primary-button" id="saveContext">使用这份背景</button></div></div></dialog>
  <dialog id="configDialog" aria-labelledby="configTitle">
    <form id="configForm">
      <header class="dialog-head">
        <div><h2 class="dialog-title" id="configTitle">模型与能力</h2><p class="dialog-sub" id="participantHint"></p></div>
        <button type="button" class="icon-button" id="closeConfig" aria-label="关闭模型与能力">×</button>
      </header>
      <div class="config-scroll">
        <div id="providerCards"></div>
        <label class="moderator-row" id="moderatorField" for="moderator"><span>归纳主持人</span><select id="moderator"></select></label>
      </div>
      <footer class="config-footer"><span id="configCount" role="status"></span><button class="primary-button" id="applyConfig" type="submit">应用设置</button></footer>
    </form>
  </dialog>
  <dialog id="healthDialog" aria-labelledby="healthTitle"><div class="dialog-head"><div><h2 class="dialog-title" id="healthTitle">工具连接</h2><div class="dialog-sub">使用本机已登录的官方命令行工具。</div></div><button class="icon-button" id="closeHealth" aria-label="关闭工具连接">×</button></div><div class="dialog-body"><div id="healthDetails"></div><div class="health-note">在终端登录你想使用的工具，再重新检查连接。</div><button class="secondary-button health-check-button" id="refreshHealth">重新检查连接</button></div></dialog>
  <div class="toast" id="toast" role="status" hidden></div>
  <script>
    'use strict';
    const $ = (id) => document.getElementById(id);
    const providers = ['codex', 'claude', 'cursor'];
    const names = {
      codex: 'Codex',
      claude: 'Claude',
      cursor: 'Cursor',
      user: '你',
      summary: '主持人总结',
      system: '讨论提示'
    };
    const state = {
      roomId: null,
      room: null,
      messages: [],
      seen: new Set(),
      health: null,
      checking: false,
      busy: false,
      serverBusy: false,
      stopping: false,
      mode: 'debate',
      participants: ['codex', 'claude'],
      moderator: 'codex',
      settings: {},
      selectionRestored: false,
      context: '',
      statuses: new Map(),
      streamController: null,
      runStartedAt: null
    };
    const stageNames = {
      notice: '提示',
      analysis: '独立分析',
      review: '交叉审查',
      summary: '讨论总结',
      error: '提示',
      question: '问题'
    };
    const isSingle = () => providers.includes(state.mode);
    const ready = (id) =>
      Boolean(state.health?.[id]?.subscription && state.health[id].authenticated && state.health[id].available);
    const supportsWeb = (members) =>
      Boolean(state.health && members.length && members.every((id) => state.health[id]?.supportsWeb));
    const canUseMode = () =>
      Boolean(
        token &&
          state.health &&
          state.participants.every(ready) &&
          state.participants.length >= (isSingle() ? 1 : 2)
      );

    function configuration() {
      const settings = {};
      for (const id of state.participants) {
        const { model = '', reasoning = '', capability = 'general' } = state.settings[id] || {};
        settings[id] = { model, reasoning, capability };
      }
      return {
        mode: state.mode,
        participants: [...state.participants],
        moderator: state.moderator,
        settings,
        webSearch: $('webSearch').checked && supportsWeb(state.participants)
      };
    }

    function restoreConfiguration(config) {
      if (!config || !['debate', 'both', ...providers].includes(config.mode)) return;
      const members = providers.includes(config.mode)
        ? [config.mode]
        : Array.isArray(config.participants)
        ? providers.filter((id) => config.participants.includes(id))
        : ['codex', 'claude'];
      if (!providers.includes(config.mode) && members.length < 2) return;
      state.mode = config.mode;
      state.participants = members;
      state.moderator = members.includes(config.moderator) ? config.moderator : members[0];
      state.settings = {};
      for (const id of providers) {
        const settings = config.settings?.[id] || {};
        state.settings[id] = {
          model: typeof settings.model === 'string' ? settings.model : '',
          reasoning: typeof settings.reasoning === 'string' ? settings.reasoning : '',
          capability: typeof settings.capability === 'string' ? settings.capability : 'general'
        };
      }
      $('webSearch').checked = Boolean(config.webSearch);
      state.selectionRestored = true;
    }

    function defaultParticipants() {
      if (state.selectionRestored) return;
      const connected = providers.filter(ready);
      if (!connected.length) return;
      state.participants = connected.slice(0, 2);
      state.moderator = state.participants[0];
      state.mode = connected.length === 1 ? connected[0] : 'debate';
    }

    function changeMode(mode) {
      if (mode === 'single') {
        const id = state.participants.find(ready) || providers.find(ready) || state.participants[0];
        state.mode = id;
        state.participants = [id];
      } else {
        if (state.participants.length < 2) {
          const others = providers.filter((id) => !state.participants.includes(id));
          state.participants = [...state.participants, others.find(ready) || others[0]];
        }
        state.mode = mode;
      }
      if (!state.participants.includes(state.moderator)) state.moderator = state.participants[0];
      state.selectionRestored = true;
      updateControls();
      persistDraft();
    }

    function updateControls() {
      const running = state.busy || state.serverBusy;
      $('sendButton').disabled = running || state.checking || !canUseMode() || !$('prompt').value.trim();
      $('sendButton').hidden = running;
      $('stopButton').hidden = !running;
      $('stopButton').disabled = state.stopping;
      $('stopLabel').textContent = state.stopping ? '正在停止…' : '停止讨论';
      $('sendLabel').textContent = state.roomId ? '继续讨论' : state.mode === 'debate' ? '开始讨论' : '发送问题';
      $('prompt').disabled = running;
      $('contextButton').disabled = running;
      $('configureButton').disabled = running || !state.health;
      const webAvailable = supportsWeb(state.participants);
      if (state.health && !webAvailable) $('webSearch').checked = false;
      $('webSearch').disabled = running || !webAvailable;
      $('webControl').title =
        state.health && !webAvailable ? '当前参与者中有工具不支持网页检索' : '允许参与者在回答时搜索网页';
      for (const button of document.querySelectorAll('[data-mode]')) {
        const active = button.dataset.mode === (isSingle() ? 'single' : state.mode);
        button.classList.toggle('active', active);
        button.setAttribute('aria-pressed', String(active));
        button.disabled = running || !state.health;
      }
      $('newRoom').disabled = running;
      $('exportButton').disabled = !state.roomId;
      $('mobileExport').hidden = !state.roomId;
      const team = state.participants.map((id) => names[id]).join('、');
      const teamCaption = state.mode === 'debate' ? team + ' · ' + names[state.moderator] + ' 归纳' : team;
      $('modeHelp').textContent = state.checking
        ? '正在检查本机工具…'
        : !token
        ? '请从启动终端打开完整的页面地址。'
        : !canUseMode()
        ? '当前参与者未就绪，可在「模型与能力」中更换。'
        : teamCaption;
      $('configureButton').title = '设置参与者、模型和能力 · ' + team;
      const badges = $('activeParticipants');
      if (badges.dataset.team !== team) {
        badges.dataset.team = team;
        badges.replaceChildren(
          ...state.participants.map((id) => element('span', 'participant ' + id, names[id]))
        );
      }
      $('flowDescription').textContent =
        state.mode === 'debate'
          ? '参与者先各自回答，再交换意见。由 ' + names[state.moderator] + ' 整理共识与分歧。'
          : state.mode === 'both'
          ? '参与者将独立回答同一个问题，你可以逐条比较各自的理由。'
          : '由 ' + names[state.participants[0]] + ' 回答这个问题，你可以在同一场讨论中继续追问。';
      $('contextDot').hidden = !state.context.trim();
      $('progress').hidden = !running;
      if (running) {
        const summaries = [...state.statuses.values()];
        $('progressText').textContent = summaries.length
          ? summaries.join(' · ')
          : state.busy
          ? '正在准备讨论…'
          : '有一场讨论正在运行，可以稍后查看记录。';
      }
    }

    let configDraft;
    const activeCapabilities = () =>
      state.health?.capabilities || [{ id: 'general', label: '通用分析', description: '' }];

    function addOption(select, value, label) {
      const option = element('option', '', label);
      option.value = value;
      select.append(option);
    }

    function field(parent, labelText, id, control, extraClass = '') {
      const wrap = element('div', ('option-field ' + extraClass).trim());
      const label = element('label', 'option-label', labelText);
      control.id = id;
      label.htmlFor = id;
      wrap.append(label, control);
      parent.append(wrap);
      return wrap;
    }

    function renderProviderFields(id, card) {
      const info = state.health[id] || {};
      const choice = (configDraft.settings[id] ||= { model: '', reasoning: '', capability: 'general' });
      const fields = element('div', 'provider-fields');
      const modelSelect = element('select');
      const modelField = field(fields, '模型', 'model-' + id, modelSelect, 'model-field');
      addOption(modelSelect, '', 'CLI 默认模型');
      for (const model of info.models || []) addOption(modelSelect, model, model);
      addOption(modelSelect, '__custom', '手动输入模型 ID…');
      const isCustom = choice.model && !(info.models || []).includes(choice.model);
      modelSelect.value = isCustom ? '__custom' : choice.model;
      const custom = element('input');
      custom.type = 'text';
      custom.id = 'custom-' + id;
      custom.maxLength = 240;
      custom.spellcheck = false;
      custom.autocomplete = 'off';
      custom.setAttribute('aria-label', names[id] + ' 自定义模型 ID');
      custom.placeholder = '输入此 CLI 支持的模型 ID';
      custom.value = isCustom ? choice.model : '';
      custom.hidden = !isCustom;
      custom.required = Boolean(isCustom);
      modelField.append(custom);

      const capability = element('select');
      field(fields, '分析能力', 'capability-' + id, capability);
      const options = activeCapabilities();
      for (const item of options) addOption(capability, item.id, item.label);
      capability.value = options.some((item) => item.id === choice.capability) ? choice.capability : 'general';
      choice.capability = capability.value;
      const reasoning = element('select');
      const reasoningField = field(fields, '推理强度', 'reasoning-' + id, reasoning);
      function refreshReasoning() {
        const perModel = info.reasoningByModel || {};
        const levels = Object.hasOwn(perModel, choice.model)
          ? perModel[choice.model]
          : info.reasoningLevels || [];
        reasoning.replaceChildren();
        addOption(reasoning, '', 'CLI 默认强度');
        for (const level of levels) addOption(reasoning, level, level);
        if (!levels.includes(choice.reasoning)) choice.reasoning = '';
        reasoning.value = choice.reasoning;
        reasoningField.hidden = !levels.length;
      }
      refreshReasoning();
      reasoning.addEventListener('change', () => {
        choice.reasoning = reasoning.value;
      });
      const note = element('p', 'capability-note');
      function describeCapability() {
        choice.capability = capability.value;
        note.textContent = options.find((item) => item.id === choice.capability)?.description || '';
        note.hidden = !note.textContent;
      }
      describeCapability();
      capability.addEventListener('change', describeCapability);
      fields.append(note);
      modelSelect.addEventListener('change', () => {
        const manual = modelSelect.value === '__custom';
        custom.hidden = !manual;
        custom.required = manual;
        custom.setCustomValidity('');
        choice.model = manual ? custom.value.trim() : modelSelect.value;
        refreshReasoning();
        if (manual) custom.focus();
      });
      custom.addEventListener('input', () => {
        choice.model = custom.value.trim();
        custom.setCustomValidity(choice.model ? '' : '请输入模型 ID。');
        refreshReasoning();
      });
      card.append(fields);
    }

    function renderConfiguration() {
      const single = isSingle();
      const cards = $('providerCards');
      cards.replaceChildren();
      $('participantHint').textContent = single
        ? '选择一位参与者，并设置本轮回答使用的模型和能力。'
        : '选择两到三位参与者，可分别设置模型和能力。';
      for (const id of providers) {
        const selected = configDraft.participants.includes(id);
        const card = element('section', 'provider-card' + (selected ? ' selected' : ''));
        const label = element('label', 'provider-row');
        const input = element('input');
        input.type = single ? 'radio' : 'checkbox';
        input.name = 'provider';
        input.id = 'participant-' + id;
        input.checked = selected;
        const status = ready(id) ? '已登录' : state.health[id]?.available ? '未就绪' : '未连接';
        label.append(
          input,
          element('span', 'provider-name', names[id]),
          element('span', 'provider-state' + (ready(id) ? ' ready' : ''), status)
        );
        input.addEventListener('change', () => {
          const members = configDraft.participants;
          configDraft.participants = single
            ? [id]
            : input.checked
            ? [...members, id]
            : members.filter((member) => member !== id);
          if (!configDraft.participants.includes(configDraft.moderator))
            configDraft.moderator = configDraft.participants[0] || '';
          renderConfiguration();
          $('participant-' + id).focus({ preventScroll: true });
        });
        card.append(label);
        if (selected) renderProviderFields(id, card);
        cards.append(card);
      }
      const members = configDraft.participants;
      const moderator = $('moderator');
      moderator.replaceChildren();
      for (const id of members) addOption(moderator, id, names[id]);
      moderator.value = configDraft.moderator;
      $('moderatorField').hidden = state.mode !== 'debate';
      const valid = members.length >= (single ? 1 : 2);
      $('configCount').textContent = valid
        ? '已选 ' + members.length + ' 位参与者'
        : single
        ? '请选择一位参与者'
        : '此模式至少需要两位参与者';
      $('applyConfig').disabled = !valid;
    }

    function openConfiguration() {
      configDraft = {
        participants: [...state.participants],
        moderator: state.moderator,
        settings: structuredClone(state.settings)
      };
      renderConfiguration();
      $('configDialog').showModal();
    }

    function applyConfiguration(event) {
      event.preventDefault();
      if ($('applyConfig').disabled || !configDraft) return;
      const single = isSingle();
      state.participants = [...configDraft.participants];
      if (single) state.mode = state.participants[0];
      state.moderator = configDraft.moderator;
      state.settings = configDraft.settings;
      state.selectionRestored = true;

    function markdown(text) {

          .replace(/^\|/, '')
          .replace(/\|$/, '')
          .split('|')
          .map((x) => x.trim());

        /^\s*```|^#{1,6}\s|^\s*([-*]|\d+[.)])\s|^>\s?|^\s*([-*_])(?:\s*\1){2,}\s*$/.test(line);

        if (!line.trim()) {

        }

          i++;

          pre.append(element('code', '', code.join('\n')));
          fragment.append(pre);

            table = element('table'),

            headRow = element('tr');

          const body = element('tbody');
          i += 2;

            body.append(tr);

          table.append(body);
          wrap.append(table);

        }
        const heading = line.match(/^(#{1,6})\s+(.+)$/);
        if (heading) {

            const li = element('li');

        }
        const paragraph = [line];
        i++;

          i < lines.length &&
          lines[i].trim() &&

    $('menuButton').addEventListener('click', () => setSidebar(!$('sidebar').classList.contains('open')));
    $('mobileOverlay').addEventListener('click', () => setSidebar(false));
    $('jumpBottom').addEventListener('click', toBottom);
    $('conversation').addEventListener(
      'scroll',
      () => {
        $('jumpBottom').hidden = nearBottom() || !state.messages.length;
      },
      { passive: true }
    );
    $('contextButton').addEventListener('click', () => {
      $('contextInput').value = state.context;
      $('contextCount').textContent = `${state.context.length.toLocaleString()} / 40,000 字符`;
      $('contextDialog').showModal();
    });
    $('closeContext').addEventListener('click', () => $('contextDialog').close());
    $('contextInput').addEventListener('input', () => {
      $('contextCount').textContent = `${$('contextInput').value.length.toLocaleString()} / 40,000 字符`;
    });
    $('saveContext').addEventListener('click', () => {
      state.context = $('contextInput').value.trim();
      $('contextDialog').close();
      updateControls();
      persistDraft();
      toast(state.context ? '共同背景会随下次提问一起发送。' : '已清空共同背景。');
    });
    for (const name of providers)
      $(name + 'Pill').addEventListener('click', () => {
        renderHealth();
        $('healthDialog').showModal();
      });
    $('closeHealth').addEventListener('click', () => $('healthDialog').close());
    $('refreshHealth').addEventListener('click', () => checkHealth(true));
    for (const id of ['contextDialog', 'healthDialog', 'configDialog'])
      $(id).addEventListener('click', (event) => {
        if (event.target === $(id)) {
          const rect = $(id).getBoundingClientRect();
          if (
            event.clientX < rect.left ||
            event.clientX > rect.right ||
            event.clientY < rect.top ||
            event.clientY > rect.bottom
          )
            $(id).close();
        }
      });
    window.addEventListener('beforeunload', (event) => {
      if (state.busy) {
        event.preventDefault();
        event.returnValue = '';
      }
    });
    $('configureButton').addEventListener('click', openConfiguration);
    $('closeConfig').addEventListener('click', () => $('configDialog').close());
    $('configForm').addEventListener('submit', applyConfiguration);
    $('moderator').addEventListener('change', () => {
      configDraft.moderator = $('moderator').value;
    });
    async function init() {
      if (!/Mac|iPhone|iPad/.test(navigator.platform)) $('keyHint').textContent = 'Ctrl Enter 发送';
      try {
        const draft = JSON.parse(storage.get('decision-room-draft') || '{}');
        restoreConfiguration(draft.configuration || draft);
        state.context = typeof draft.context === 'string' ? draft.context : '';
        $('prompt').value = typeof draft.prompt === 'string' ? draft.prompt : '';
      } catch {}
      autosize();
      if (!token) {
        showError('请从启动终端打开完整的页面地址，以连接你电脑上的模型工具。');
        $('roomList').replaceChildren(element('p', 'history-empty', '连接本地服务后，记录会显示在这里。'));
        renderHealth();
        return;
      }
      const selected = storage.get('decision-room-selected');
      await Promise.allSettled([
        checkHealth(),
        refreshRooms(),
        selected ? loadRoom(selected, { silent: true }) : Promise.resolve()
      ]);
    }
    init();
  </script>
</body>
</html>
